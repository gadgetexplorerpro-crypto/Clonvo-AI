# Base44 development environment for Clonvo AI.
#
# Clonvo AI is a native Android client (Kotlin + Jetpack Compose) backed by
# Firebase Auth/Firestore and an ElevenLabs proxy. A native app cannot render
# inside a browser preview, so the web entry point on port 3000 serves a
# project console (./public) that exercises the parts of the repo that do run
# here: the Node API in backend/server.js and the Firebase emulator suite
# configured by firebase.json.
name: clonvo-ai

services:
  # Firebase Auth + Firestore emulators (the local backend for the Android app).
  firebase-emulators:
    build:
      context: .
      dockerfile: docker/base44/firebase-emulator.Dockerfile
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - firebase-emulator-cache:/root/.cache/firebase
    environment:
      - FIREBASE_CLI_DISABLE_UPDATE_CHECK=true
    command:
      - sh
      - -ec
      - >-
        node docker/base44/emulator-config.js &&
        exec firebase emulators:start --only firestore,auth
        --project demo-clonvoai --config /tmp/firebase.base44.json
    ports:
      - "8085:8085"
      - "9099:9099"
    restart: on-failure
    labels:
      base44.project: Firebase Emulators
      base44.kind: infra
      base44.port: "8085"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          Promise.all([fetch('http://127.0.0.1:8085/'),fetch('http://127.0.0.1:9099/')])
          .then((r)=>{const down=r.map((x,i)=>[i?'auth':'firestore',x.ok]).filter(([,ok])=>!ok)
          .map(([n])=>n);if(down.length){console.error('down: '+down.join(','));process.exit(1)}
          process.exit(0)}).catch((e)=>{console.error(e.message);process.exit(1)})
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  # ElevenLabs proxy from backend/server.js (live-reloading via node --watch).
  api:
    image: node:22-bookworm
    working_dir: /workspace
    volumes:
      - ./:/workspace
    env_file:
      - /run/base44/app.env
    environment:
      - PORT=8090
      - NODE_ENV=development
    command:
      - sh
      - -ec
      - exec node --watch backend/server.js
    ports:
      - "8090:8090"
    restart: on-failure
    labels:
      base44.project: Clonvo AI API
      base44.kind: api
      base44.port: "8090"
    healthcheck:
      # Any HTTP status means the server is up; a missing bearer token gives 401.
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8090/').then((r)=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Port-3000 entry point: project console + same-origin proxy to api/emulators.
  web:
    image: nginx:alpine
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./docker/base44/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
      firebase-emulators:
        condition: service_started
    restart: on-failure
    labels:
      base44.project: Clonvo AI Console
      base44.kind: web
      base44.port: "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  firebase-emulator-cache:
