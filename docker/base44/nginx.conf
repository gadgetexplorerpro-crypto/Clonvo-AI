# Single-origin entry point for the sandbox preview (host port 3000).
# Serves the project console from ./public and proxies, under the same origin,
# the two things that actually run in this repo: the Node API and the Firebase
# emulator suite. Single origin keeps the browser from needing CORS.
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Node API (backend/server.js)
    location /api/ {
        proxy_pass http://api:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
    }

    # Firestore emulator REST/Auth surface
    location /firestore/ {
        proxy_pass http://firebase-emulators:8085/;
        proxy_set_header Host $host;
    }
    location = /firestore {
        proxy_pass http://firebase-emulators:8085/;
    }

    # Firebase Auth emulator
    location /auth-emulator/ {
        proxy_pass http://firebase-emulators:9099/;
        proxy_set_header Host $host;
    }
    location = /auth-emulator {
        proxy_pass http://firebase-emulators:9099/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
